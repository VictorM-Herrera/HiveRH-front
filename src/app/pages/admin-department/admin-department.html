<section style="display: flex; flex-direction: column; align-items: center;">
<h1>DEPARTAMENTOS</h1>
<br>

<div style="display: flex; flex-direction: column; gap: 20px; border: 2px solid black; width: 70%;">
    <strong>Total de departamentos = {{departments().length}}</strong>
    <div>
        <h2>Departamentos</h2>
        <br>
        <div style="display: flex; flex-direction: column; width: 600px;">
            @for(p of departments(); track p.id_department){
                <div style="display: flex; justify-content: space-between;">
                    <div>
                        <strong>{{p.name}}  </strong>
                        <small>{{p.active}}  </small>
                        <small>{{p.id_department}}</small>
                    </div>
                    @if(p.id_department){
                    <button (click)="changeStatus(p.id_department, p.active)">baja</button>
                    }
                </div>
            }
        </div>
    </div>
</div>

<br>

<form [formGroup]="createDto" (ngSubmit)="createDepartment()">
    <label for="name">
        Nombre de la departamento:
        <input type="text" formControlName="name">
    </label>
    <button type="submit">Crear departamento</button>
</form>

</section>
