<aside
  [class]="'toast toast--' + type()"
  [attr.role]="type() === 'error' ? 'alert' : 'status'"
  aria-live="assertive"
>
  <span class="toast-icon" aria-hidden="true">
    <img [src]="'icons/icon-' + type() + '.svg'" alt="" />
  </span>

  <div class="toast-content">
    <strong>{{ title() }}</strong>
    <p>{{ message() }}</p>
  </div>

  <button type="button" class="toast-close" aria-label="Cerrar notificación" (click)="dismissed.emit()">
    <img src="icons/icon-close.svg" alt="" />
  </button>
</aside>
